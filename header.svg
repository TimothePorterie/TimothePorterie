<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.2s step-end infinite; }
      .titre { font-family: Archivo, 'Arial Black', Helvetica, sans-serif; font-weight: 900; }
      .machine { font-family: 'Space Mono', 'Courier New', monospace; font-weight: 700; }
    </style>
    <pattern id="trame" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#22305a" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="800" height="200" fill="#172036"/>
  <rect width="800" height="200" fill="url(#trame)"/>

  <rect x="24" y="20" width="752" height="160" fill="#f0dcae" stroke="#000" stroke-width="5"/>
  <rect x="24" y="20" width="752" height="30" fill="#3f7472" stroke="#000" stroke-width="5"/>
  <text class="machine" x="44" y="40" font-size="12" letter-spacing="3" fill="#f0dcae">AGENCE POTA NETWORK</text>
  <text class="machine" x="756" y="40" font-size="12" letter-spacing="3" fill="#f0dcae" text-anchor="end">ACCÈS OR</text>

  <text class="titre" x="54" y="122" font-size="62" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#000">PotaTim</text>
  <rect class="cursor" x="366" y="80" width="6" height="44" fill="#e4a72b"/>
  <text class="machine" x="56" y="154" font-size="13" textLength="460" lengthAdjust="spacingAndGlyphs" fill="#285351">GÉNÉREUX EN AGENTS. INTRAITABLE SUR LE RÉSULTAT.</text>

  <g transform="translate(640 112) rotate(-8)">
    <rect x="-92" y="-24" width="184" height="48" rx="4" fill="none" stroke="#c8242f" stroke-width="4"/>
    <text class="machine" x="0" y="7" font-size="18" letter-spacing="3" fill="#c8242f" text-anchor="middle">TOP SECRET</text>
  </g>
</svg>
